name: Phase 19 - validation technique
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'services/api/**'
      - '.github/workflows/phase19-validation.yml'
permissions:
  contents: read
jobs:
  flutter-phase19:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SDK versions
        run: flutter --version
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Ownership and library regression
        working-directory: apps/mobile
        run: flutter test --no-pub test/secure_session_account_ownership_test.dart test/library_catalog_refresh_test.dart
      - name: Complete Flutter suite
        working-directory: apps/mobile
        run: flutter test --no-pub
      - name: Web compilation
        working-directory: apps/mobile
        run: flutter build web --release --no-pub
  backend-phase19:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r services/api/requirements.txt
      - run: python -m compileall -q services/api/app
      - name: Security and synchronization regression
        env:
          PYTHONPATH: services/api
        run: python -m pytest -q services/api/tests/test_identity_security.py services/api/tests/test_phase18_license_status_authorization.py services/api/tests/test_security_headers_lot28.py services/api/tests/test_sync*
      - name: Complete backend regression
        env:
          PYTHONPATH: services/api
        run: python -m pytest -q services/api/tests
