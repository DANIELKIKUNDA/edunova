name: EduNova Phase 21 Functional Certification

on:
  pull_request:
    branches: [import/edunova-v0.57.12]
    paths:
      - "services/api/**"
      - ".github/workflows/phase21-functional-certification.yml"
      - "tests/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase21-functional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity-postgresql:
    name: Identity API journey on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova_phase21_ci
          POSTGRES_DB: edunova_phase21
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova_phase21"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PHASE21_POSTGRES_URL: postgresql+psycopg://edunova:edunova_phase21_ci@127.0.0.1:5432/edunova_phase21
      EDUNOVA_ENV: test
      JWT_SECRET: phase21-ci-only-not-a-production-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install backend and OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install -r services/api/requirements.txt
      - name: Prove PostgreSQL identity
        run: |
          pg_isready -h 127.0.0.1 -U edunova -d edunova_phase21
          PGPASSWORD=edunova_phase21_ci psql -h 127.0.0.1 -U edunova -d edunova_phase21 -c "select version(), current_database(), current_setting('TimeZone');"
      - name: Run Phase 21 identity journey
        working-directory: services/api
        run: |
          mkdir -p ../../certification-results/phase21
          python -m pytest -q tests/test_phase21_identity_postgres_e2e.py \
            --junitxml=../../certification-results/phase21/identity-postgresql.xml
      - name: Upload Phase 21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-identity-postgresql-evidence
          path: certification-results/phase21/
          if-no-files-found: error
          retention-days: 30

  security-sync-postgresql:
    name: Multi-account security and synchronization on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova_phase21_ci
          POSTGRES_DB: edunova_phase21
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova_phase21"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PHASE21_POSTGRES_URL: postgresql+psycopg://edunova:edunova_phase21_ci@127.0.0.1:5432/edunova_phase21
      EDUNOVA_ENV: test
      JWT_SECRET: phase21-ci-only-not-a-production-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install backend and OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install -r services/api/requirements.txt
      - name: Run adversarial tenant, role and synchronization journeys
        working-directory: services/api
        run: |
          mkdir -p ../../certification-results/phase21
          python -m pytest -q \
            tests/test_sync_lot7.py \
            tests/test_platform_governance_owner_isolation.py \
            tests/test_platform_governance_recovery.py \
            --junitxml=../../certification-results/phase21/security-sync-postgresql.xml
      - name: Upload security and sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-security-sync-postgresql-evidence
          path: certification-results/phase21/
          if-no-files-found: error
          retention-days: 30

  payments-documents-postgresql:
    name: Sandbox payments, private documents and editorial controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova_phase21_ci
          POSTGRES_DB: edunova_phase21
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova_phase21"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PHASE21_POSTGRES_URL: postgresql+psycopg://edunova:edunova_phase21_ci@127.0.0.1:5432/edunova_phase21
      EDUNOVA_ENV: test
      JWT_SECRET: phase21-ci-only-not-a-production-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      PAYMENT_SANDBOX_SECRET: phase21-sandbox-only
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install backend and OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install -r services/api/requirements.txt
      - name: Run payment, ingestion, assistant and editorial journeys
        working-directory: services/api
        run: |
          mkdir -p ../../certification-results/phase21
          python -m pytest -q \
            tests/test_payment_gateway_phase7.py \
            tests/test_phase19_payment_hardening.py \
            tests/test_commerce_api_e2e.py \
            tests/ingestion/test_ingestion_api.py \
            tests/ingestion/test_security_storage.py \
            tests/editorial/test_editorial_api.py \
            tests/editorial/test_editorial_api_maximal.py \
            --junitxml=../../certification-results/phase21/payments-documents-postgresql.xml
          env -u PHASE21_POSTGRES_URL \
            DATABASE_URL=sqlite+pysqlite:///../../.local-certification/phase21-assistant.db \
            python -m pytest -q tests/assistant/test_assistant_api_e2e.py \
            --junitxml=../../certification-results/phase21/assistant-private-context-sqlite.xml
      - name: Upload payment and document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-payments-documents-postgresql-evidence
          path: certification-results/phase21/
          if-no-files-found: error
          retention-days: 30

  flutter-contracts:
    name: Flutter private data, offline, Premium and administration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run Mobile Phase 21 contracts
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub \
            test/secure_session_account_ownership_test.dart \
            test/cloud_sync_use_case_test.dart \
            test/sync_push_integrity_test.dart \
            test/import_personal_document_test.dart \
            test/commerce_domain_test.dart \
            test/combined_access_test.dart \
            test/campus_intelligence_access_widget_test.dart \
            test/campus_intelligence_tenant_transition_widget_test.dart \
            --machine > ../../certification-results-phase21-mobile.jsonl
      - name: Run Administration contracts
        working-directory: apps/admin
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --machine > ../../certification-results-phase21-admin.jsonl
      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-flutter-contract-evidence
          path: |
            certification-results-phase21-mobile.jsonl
            certification-results-phase21-admin.jsonl
          if-no-files-found: error
          retention-days: 30

  flutter-web-api-postgresql:
    name: Flutter Web login through API to PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova_phase21_ci
          POSTGRES_DB: edunova_phase21
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova_phase21"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://edunova:edunova_phase21_ci@127.0.0.1:5432/edunova_phase21
      EDUNOVA_ENV: test
      JWT_SECRET: phase21-ci-only-not-a-production-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      EDUNOVA_API_URL: http://127.0.0.1:8000
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and start the real backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install -r services/api/requirements.txt
          (cd services/api && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../phase21-api.log 2>&1 &)
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
      - name: Build Flutter Web for the Phase 21 backend
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run \
            --dart-define=EDUNOVA_API_BASE_URL=http://127.0.0.1:8000
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test@1.56.1 http-server@14.1.1
          google-chrome --version
      - name: Run real Flutter Web journeys
        run: |
          mkdir -p certification-results/phase21
          npx playwright test tests/e2e/phase21-functional.spec.js \
            --config=tests/e2e/playwright.phase21.config.js --reporter=line
      - name: Upload browser, API and database-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-flutter-web-api-postgresql-evidence
          path: |
            certification-results/phase21/
            test-results/
            playwright-report/
            phase21-api.log
          if-no-files-found: warn
          retention-days: 30

  release-readiness:
    name: Android artifact, migrations and release manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova_phase21_ci
          POSTGRES_DB: edunova_phase21
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova_phase21"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://edunova:edunova_phase21_ci@127.0.0.1:5432/edunova_phase21
      EDUNOVA_ENV: test
      JWT_SECRET: phase21-ci-only-not-a-production-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify migrations on a blank PostgreSQL database
        run: |
          python -m pip install -r services/api/requirements.txt
          DATABASE_URL=postgresql://edunova:edunova_phase21_ci@127.0.0.1:5432/edunova_phase21 \
            bash scripts/migrate_production.sh
          cd services/api
          python -m pytest -q tests/test_migration_contract.py \
            --junitxml=../../certification-results-phase21-migrations.xml
      - name: Build traceable Android artifact
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --org tech.volcano.edunova .
          sed -i -E 's#gradle-[0-9.]+-#gradle-8.14-#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/8.9.1/8.11.1/g' android/settings.gradle.kts
          sed -i 's/2.1.0/2.2.20/g' android/settings.gradle.kts
          flutter pub get
          flutter build apk --release
      - name: Record hashes and signing limitation
        run: |
          mkdir -p certification-results/phase21
          sha256sum apps/mobile/build/app/outputs/flutter-apk/app-release.apk | tee certification-results/phase21/android-apk-sha256.txt
          git rev-parse HEAD | tee certification-results/phase21/tested-commit.txt
          printf '%s\n' 'Android artifact compiled for technical validation. Store signing remains NON VERIFIED until owner-managed secrets and physical-device acceptance exist.' > certification-results/phase21/release-limitation.txt
          if git ls-files | grep -E '(^|/)(key\.properties|.*\.jks|.*\.keystore|AuthKey_.*\.p8)$'; then
            echo 'Signing secret material is tracked in Git' >&2
            exit 1
          fi
      - name: Upload release evidence and APK
        uses: actions/upload-artifact@v4
        with:
          name: phase21-release-readiness
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            certification-results/phase21/
            certification-results-phase21-migrations.xml
          if-no-files-found: error
          retention-days: 30
