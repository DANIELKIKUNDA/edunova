name: EduNova CI
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: edunova-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: services/api/requirements.txt}
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - run: pip install -r services/api/requirements.txt
      - run: python -m compileall -q services/api/app
      - run: cd services/api && pytest -q
      - run: python scripts/audit_lot30.py
      - run: python scripts/audit_campus_intelligence_flutter.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: services/api, push: false, tags: edunova-api:ci}

  campus-flutter:
    name: Phase 14/15/16 Flutter analyze and widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Dart analysis
        working-directory: apps/mobile
        run: flutter analyze --no-pub
      - name: Phase 14/15 tenant, privilege and archive adversarial widgets
        working-directory: apps/mobile
        run: flutter test --no-pub test/campus_intelligence_tenant_transition_widget_test.dart test/campus_intelligence_archive_scope_widget_test.dart
      - name: Phase 16 academic resources and alumni gateway contracts
        working-directory: apps/mobile
        run: flutter test --no-pub test/campus_academic_alumni_gateway_test.dart
      - name: Flutter widget and gateway tests
        working-directory: apps/mobile
        run: flutter test --no-pub
      - name: Flutter web build (compilation only, not device certification)
        working-directory: apps/mobile
        run: flutter build web --release --no-pub

  admin-flutter:
    name: Flutter administration analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve admin dependencies
        working-directory: apps/admin
        run: flutter pub get
      - name: Analyze admin application
        working-directory: apps/admin
        run: flutter analyze --no-pub
      - name: Run admin tests
        working-directory: apps/admin
        run: flutter test --no-pub
