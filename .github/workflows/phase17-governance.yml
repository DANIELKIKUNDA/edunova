name: EduNova Phase 17 Governance
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/api/**'
      - 'apps/admin/**'
      - '.github/workflows/phase17-governance.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'apps/admin/**'
      - '.github/workflows/phase17-governance.yml'
permissions:
  contents: read
jobs:
  governance-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/api/requirements.txt
      - name: Governance security and Flutter API contracts
        env:
          PYTHONPATH: services/api
        run: |
          mkdir -p evidence
          python -m pytest -q services/api/tests/test_phase17_institution_directory_v0524.py services/api/tests/test_phase17_institution_control_v0523.py services/api/tests/test_platform_governance_recovery.py services/api/tests/test_platform_governance_owner_isolation.py services/api/tests/test_phase17_flutter_governance_contract.py services/api/tests/test_phase17_central_operations_v0527.py --junitxml=evidence/phase17.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-governance-backend
          path: evidence/
          if-no-files-found: warn
  governance-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/admin
        run: flutter pub get
      - working-directory: apps/admin
        run: flutter analyze --no-pub
      - working-directory: apps/admin
        run: flutter test --no-pub
      - working-directory: apps/admin
        run: flutter build web --release --no-pub
