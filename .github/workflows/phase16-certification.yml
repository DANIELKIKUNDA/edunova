name: EduNova Phase 16 Certification

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/api/**'
      - 'apps/mobile/**'
      - 'apps/admin/**'
      - 'scripts/audit_phase16*'
      - '.github/workflows/phase16-certification.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'apps/mobile/**'
      - 'apps/admin/**'
      - 'scripts/audit_phase16*'
      - '.github/workflows/phase16-certification.yml'

permissions:
  contents: read
concurrency:
  group: phase16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-phase16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - run: python -m pip install -r services/api/requirements.txt
      - name: Verify Python source compiles
        run: python -m compileall -q services/api/app services/api/tests
      - name: Phase 16 backend regression and XML evidence
        env:
          PYTHONPATH: services/api
        run: |
          mkdir -p certification-results
          python -m pytest -q services/api/tests -k phase16 --junitxml=certification-results/backend-phase16.xml
      - name: Phase 16 structural closure audit
        run: python scripts/audit_phase16_closure_v0_51_9.py
      - name: Upload backend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edunova-phase16-backend-evidence
          path: certification-results/
          if-no-files-found: warn
          retention-days: 30

  flutter-phase16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record Flutter environment
        run: flutter --version
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: apps/mobile
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run all Flutter tests and capture machine-readable evidence
        working-directory: apps/mobile
        run: |
          mkdir -p ../../certification-results
          set -o pipefail
          flutter test --no-pub --machine | tee ../../certification-results/flutter-tests.jsonl
      - name: Build Flutter web
        working-directory: apps/mobile
        run: flutter build web --release --no-pub
      - name: Upload Flutter evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edunova-phase16-flutter-evidence
          path: certification-results/
          if-no-files-found: warn
          retention-days: 30

  backend-full-regression:
    name: Complete backend regression (after Phase 16)
    needs: backend-phase16
    if: ${{ !cancelled() && needs.backend-phase16.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - run: python -m pip install -r services/api/requirements.txt
      - name: Run complete backend suite and collect JUnit
        env:
          PYTHONPATH: services/api
        run: |
          mkdir -p certification-results
          timeout 75m python -m pytest -q services/api/tests --junitxml=certification-results/backend-full.xml
      - name: Preserve evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edunova-backend-full-results
          path: certification-results/
          if-no-files-found: warn
          retention-days: 30

  flutter-admin:
    name: Flutter editorial administration checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve admin dependencies
        working-directory: apps/admin
        run: flutter pub get
      - name: Analyze admin
        working-directory: apps/admin
        run: flutter analyze --no-pub
      - name: Test admin and preserve JSONL
        working-directory: apps/admin
        run: |
          mkdir -p ../../certification-results
          set -o pipefail
          flutter test --no-pub --machine | tee ../../certification-results/admin-tests.jsonl
      - name: Upload evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edunova-admin-results
          path: certification-results/
          if-no-files-found: warn
          retention-days: 30
