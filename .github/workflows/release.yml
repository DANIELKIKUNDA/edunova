name: EduNova Release Gate

# Public CI safety: certification only. Production deployment is deliberately
# disabled while the repository may be public. No SSH or production secret is
# referenced by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edunova-release-certification
  cancel-in-progress: true

jobs:
  gate:
    name: Certification de publication — sans déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - name: Régression backend complète
        working-directory: services/api
        run: pytest -q
      - name: Audit technique
        run: python scripts/audit_lot30.py
      - name: Garde-fou publication publique
        run: echo "Certification terminée sans accès au staging ni à la production."
