name: EduNova Security
on: [push, pull_request]
permissions: {contents: read, security-events: write}
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pip-audit
      - run: pip-audit -r services/api/requirements.txt
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edunova-api:scan services/api
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: 'edunova-api:scan', format: 'table', exit-code: '1', severity: 'CRITICAL,HIGH', ignore-unfixed: true}
